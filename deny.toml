# Supply-chain policy. Enforced by `cargo deny check` in CI (workflow `ci.yml`,
# job `supply-chain`), which is the gate `PG-E0-14` requires.
#
# This file exists so that the licence and advisory rules in AGENTS R21-R25 and
# docs/DEPENDENCIES.md §6 are mechanical rather than a review habit.

[graph]
# Only the platforms we ship. Checking every cfg on every target produces
# findings for crates that never enter a Peregrine build.
targets = [
  { triple = "aarch64-apple-darwin" },
  { triple = "x86_64-apple-darwin" },
  { triple = "x86_64-pc-windows-msvc" },
  { triple = "aarch64-pc-windows-msvc" },
  { triple = "x86_64-unknown-linux-gnu" },
  { triple = "aarch64-unknown-linux-gnu" },
]

[advisories]
version = 2
# An advisory is a build failure, not a warning. A known-vulnerable dependency is
# not something to ship and note later.
yanked = "deny"
# Three advisories are accepted. Two are unmaintained proc-macros that expand
# into our code and are absent from the shipped binary. The third is a
# vulnerability that cannot be reached in this build. They are ignored by exact
# advisory id rather than by turning a class off, because any *other* advisory
# of the same class must still fail here.
ignore = [
  # `paste` arrives through `specta`, which is pinned at 2.0.0-rc.25 and is the
  # IPC type pipeline itself (PG-E0-06). No safe upgrade exists and there is no
  # alternative until a stable specta drops it; docs/DEPENDENCIES.md §7 tracks it.
  { id = "RUSTSEC-2024-0436", reason = "proc-macro through specta; compile-time only, and specta has no replacement (DEPENDENCIES §7)" },
  # `proc-macro-error` arrives through `glib-macros` and `gtk3-macros`, which exist
  # only on the Linux GTK stack, and again only as proc-macros. Both are upstream
  # Tauri-stack crates we cannot substitute.
  { id = "RUSTSEC-2024-0370", reason = "proc-macro through the Linux-only glib/gtk3 macros; compile-time only (DEPENDENCIES §7)" },
  # `ringbuf` 0.4 arrives only through `librqbit-utp`, which stores `u8` in a
  # `SharedRb<Heap<u8>>`. RUSTSEC-2026-0293 is a double free when a buffered
  # element's `Drop` panics, and `u8` has no `Drop`. No release of
  # `librqbit-utp` accepts `ringbuf` 0.5, so the fixed version cannot be chosen.
  { id = "RUSTSEC-2026-0293", reason = "unreachable: librqbit-utp buffers u8, whose Drop cannot panic, and no librqbit-utp release allows ringbuf 0.5" },
  # The zbus family is unmaintained, not vulnerable, and arrives only through keyring's Linux
  # secret-service backend. There is no safe upgrade and no alternative persistent keyring backend:
  # the kernel keyutils option does not survive a logout, so it cannot hold a provider key. The
  # adapter is Linux-only and never compiled on macOS or Windows.
  { id = "RUSTSEC-2026-0370", reason = "unmaintained zbus_names via keyring on Linux; no safe upgrade, and keyutils cannot persist a key" },
  { id = "RUSTSEC-2026-0371", reason = "unmaintained zvariant via keyring on Linux; no safe upgrade (same backend)" },
  { id = "RUSTSEC-2026-0372", reason = "unmaintained zvariant_derive via keyring on Linux; no safe upgrade (same backend)" },
]

[licenses]
version = 2
# The allowlist from docs/DEPENDENCIES.md §6. Strong copyleft is absent on purpose:
# GPL and LGPL code must stay outside the process boundary as a separate
# executable (ADR 0009).
allow = [
  "MIT",
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "ISC",
  "Unlicense",
  "CC0-1.0",
  "Zlib",
  "0BSD",
  "Unicode-3.0",
]
confidence-threshold = 0.9
# The allowlist is a policy that is deliberately ahead of the dependency graph:
# `BSD-3-Clause` arrives with `encoding_rs` (subtitle decoding) and Zlib with
# other platform crates. An allowlisted licence that nothing uses yet is not a
# finding, so the "unmatched license allowance" warning is off rather than
# repeatedly explained.
unused-allowed-license = "allow"
# `encoding_rs` is (Apache-2.0 OR MIT) AND BSD-3-Clause; its notice is retained in
# NOTICE. Both components are on the allowlist, so no exception is needed here.

# MPL-2.0, accepted for five unmodified transitive crates of the Tauri webview
# stack and recorded in docs/adr/0021-mpl-2-0-transitive-dependencies.md.
#
# Scoped per crate and version rather than added to `allow`: a sixth MPL crate,
# direct or transitive, must still fail this gate and be argued for. The version
# pin means a routine upgrade of one of them also fails until the record is
# updated, which is deliberate friction on a licence question.
[[licenses.exceptions]]
name = "cssparser"
version = "=0.37.0"
allow = ["MPL-2.0"]

[[licenses.exceptions]]
name = "cssparser-macros"
version = "=0.7.1"
allow = ["MPL-2.0"]

[[licenses.exceptions]]
name = "dtoa-short"
version = "=0.3.5"
allow = ["MPL-2.0"]

[[licenses.exceptions]]
name = "option-ext"
version = "=0.2.0"
allow = ["MPL-2.0"]

[[licenses.exceptions]]
name = "selectors"
version = "=0.38.0"
allow = ["MPL-2.0"]

[bans]
multiple-versions = "warn"
wildcards = "deny"
# Our own crates are declared as `{ path = "crates/..." }` in the workspace and
# inherited as `{ workspace = true }`. Cargo resolves that to a wildcard version
# requirement, which is exactly what this lint exists to catch for a *registry*
# dependency and is meaningless for a path dependency inside this repository.
# Without this, the gate reports eleven findings against our own manifests and
# stops being readable; with it, a wildcard on a registry crate is still denied.
allow-wildcard-paths = true
# Deny by name rather than by licence as a second line of defence: these are the
# specific mistakes the docs call out, and a name is unambiguous even when a
# crate's licence metadata is wrong.
# A graph-wide denial is only correct for a crate whose *presence anywhere* is
# unacceptable: copyleft inside our process boundary, or a system TLS stack we
# deliberately do not use.
#
# It is the wrong tool for "we chose something else", which is what the rest of
# docs/DEPENDENCIES.md §"Deliberately not used" records. `time` and `once_cell`
# are unavoidable transitive dependencies of ordinary crates — `once_cell`
# already arrives via `tempfile` -> `proptest` — so denying them graph-wide would
# fail the build for a dependency we never chose. Direct-dependency discipline is
# enforced where it can actually be enforced: `cargo xtask check-arch` rejects any
# crate name not listed for that crate in arch-allowlist.toml.
deny = [
  # Static linking would put LGPL/GPL code inside our binary (ADR 0009).
  { name = "libmpv2", reason = "LGPL-2.1 and statically linked; mpv runs as a subprocess (ADR 0013)" },
  { name = "mpv-client", reason = "GPL-3.0; we speak JSON IPC over a socket instead" },
  { name = "openssl", reason = "reqwest uses rustls so we do not depend on a system TLS stack" },
  { name = "openssl-sys", reason = "reqwest uses rustls so we do not depend on a system TLS stack" },
]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
