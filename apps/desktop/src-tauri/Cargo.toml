[package]
name = "peregrine-desktop"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
description = "Peregrine desktop shell: window and process lifecycle only."
publish = false

[build-dependencies]
tauri-build = { workspace = true }

# The shell is deliberately thin: the window, the event loop, and an error type
# that says why a launch failed. Everything else arrives over the IPC contract
# (docs/ARCHITECTURE.md §7), so the only internal crate it names is the one that
# owns that contract.
[dependencies]
peregrine-ipc = { workspace = true }
tauri = { workspace = true }
# The main window's size, position, and maximized state survive a restart because
# this plugin owns them (docs/ARCHITECTURE.md §6), not because this crate writes a
# geometry file of its own.
tauri-plugin-window-state = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }

[lints]
workspace = true
