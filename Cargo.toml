# Peregrine workspace.
#
# One crate per entry in the module map (docs/ARCHITECTURE.md §5). The edges
# between them are not a convention: `cargo xtask check-arch` parses every
# manifest here and fails on an edge that arch-allowlist.toml does not permit.
#
# Versions are pinned exactly rather than ranged wherever the API surface is one
# we depend on closely, per docs/DEPENDENCIES.md §1.

[workspace]
resolver = "3"
members = [
  "apps/desktop/src-tauri",
  "crates/peregrine-domain",
  "crates/peregrine-storage",
  "crates/peregrine-providers",
  "crates/peregrine-sync",
  "crates/peregrine-torrent",
  "crates/peregrine-indexers",
  "crates/peregrine-monitor",
  "crates/peregrine-mcp",
  "crates/peregrine-playback",
  "crates/peregrine-stream",
  "crates/peregrine-cast",
  "crates/peregrine-secrets",
  "crates/peregrine-platform",
  "crates/peregrine-app",
  "crates/peregrine-ipc",
  "crates/peregrine-testkit",
  "xtask",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
# Stable minus two releases, per the MSRV rule in docs/DEPENDENCIES.md §1.
rust-version = "1.95"
license = "MIT OR Apache-2.0"
authors = ["The Peregrine Authors"]
repository = "https://github.com/peregrine-app/peregrine"
homepage = "https://github.com/peregrine-app/peregrine"

# Workspace-internal crates, with explicit paths. A member inherits one with
# `{ workspace = true }`, which is what `check-arch` resolves to name the edge.
[workspace.dependencies]
peregrine-app = { path = "crates/peregrine-app" }
peregrine-cast = { path = "crates/peregrine-cast" }
peregrine-domain = { path = "crates/peregrine-domain" }
peregrine-indexers = { path = "crates/peregrine-indexers" }
peregrine-ipc = { path = "crates/peregrine-ipc" }
peregrine-mcp = { path = "crates/peregrine-mcp" }
peregrine-monitor = { path = "crates/peregrine-monitor" }
peregrine-platform = { path = "crates/peregrine-platform" }
peregrine-playback = { path = "crates/peregrine-playback" }
peregrine-providers = { path = "crates/peregrine-providers" }
peregrine-secrets = { path = "crates/peregrine-secrets" }
peregrine-storage = { path = "crates/peregrine-storage" }
peregrine-stream = { path = "crates/peregrine-stream" }
peregrine-sync = { path = "crates/peregrine-sync" }
peregrine-testkit = { path = "crates/peregrine-testkit" }
peregrine-torrent = { path = "crates/peregrine-torrent" }
anyhow = { version = "1.0.104" }
futures = { version = "0.3.34" }
jiff = { version = "0.2.38", features = ["serde"] }
proptest = { version = "1.11.0" }
secrecy = { version = "0.10.3" }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = { version = "1.0.151" }
sha2 = { version = "0.11.0" }
# No stable 2.x exists, so the RC is deliberate and pinned exactly
# (docs/DEPENDENCIES.md §1 and §7). A patch release can change the generated
# TypeScript, which would break the `cargo xtask gen-ipc --check` gate.
specta = { version = "=2.0.0-rc.25", features = ["derive", "function"] }
# `tauri-specta`'s `typescript` feature already depends on this at the same
# version; naming it directly is what lets the export entry point construct the
# `Typescript` exporter without reaching through a re-export path.
specta-typescript = { version = "=0.0.12" }
sqlx = { version = "0.9.0", default-features = false, features = ["runtime-tokio", "sqlite", "migrate", "json", "macros"] }
tauri = { version = "2.12.1" }
tauri-build = { version = "2.7.1" }
tauri-specta = { version = "=2.0.0-rc.25", features = ["derive", "typescript"] }
# The native file and folder pickers (PG-E1-12). The platform's own dialog is the only
# one that behaves like the rest of the desktop, and it needs no window of ours to draw.
tauri-plugin-dialog = { version = "2.8.2" }
# Single-instance enforcement with argument forwarding (PG-E1-04). This is the
# implementation the Tauri project maintains per OS; a hand-rolled lock would have to
# reimplement a named mutex, a D-Bus name, and a Unix socket, and would be the only one
# nobody else tests.
tauri-plugin-single-instance = { version = "2.5.3" }
# Window geometry belongs to this plugin rather than to hand-rolled persistence:
# docs/ARCHITECTURE.md §6 puts "window geometry" in the plugin's row and lists
# "Reimplemented" in the Never column.
tauri-plugin-window-state = { version = "2.5.0" }
thiserror = { version = "2.0.21" }
tempfile = { version = "3.27.0" }
tokio = { version = "1.53.2", features = ["rt-multi-thread", "macros", "sync", "time", "fs", "io-util"] }
tokio-util = { version = "0.7.19" }
toml = { version = "1.1.7" }
tracing = { version = "0.1.44" }
tracing-appender = { version = "0.2.5" }
tracing-subscriber = { version = "0.3.23", features = ["env-filter", "json", "registry"] }
ulid = { version = "3.0.0", features = ["serde"] }
# `pnpm-lock.yaml` is YAML, and a hand-rolled reader in a gate is a correctness
# risk (docs/DEPENDENCIES.md §4), so `check-notices` reads the frontend runtime
# closure with a real YAML parser (PG-E0-18). The default `encoding` feature is
# off: `pnpm-lock.yaml` is UTF-8 text we already hold, and enabling it would add
# `encoding_rs` to the graph for a conversion the gate never performs.
yaml-rust2 = { version = "0.13.0", default-features = false }
zeroize = { version = "1.9.1" }

[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"
unused_must_use = "deny"
rust_2018_idioms = { level = "warn", priority = -1 }

[workspace.lints.clippy]
# Pedantic is the baseline, not an aspiration. The allows below are the handful
# of pedantic lints whose advice is wrong for this codebase; each has a reason.
pedantic = { level = "warn", priority = -1 }
# AGENTS R19 asks for one concise rustdoc line on public items and no more.
# These three lints would demand boilerplate that R19 explicitly does not want.
missing_errors_doc = "allow"
missing_panics_doc = "allow"
must_use_candidate = "allow"
# Domain language repeats across modules by design (`ReleaseName::name`,
# `SearchQuery::query`); the struct is the namespace.
module_name_repetitions = "allow"
# Byte offsets, durations, and item counts are known-small at the conversion
# sites, and the checked alternatives are less readable there.
cast_possible_truncation = "allow"
cast_sign_loss = "allow"
cast_precision_loss = "allow"
# `unwrap`/`expect` policy is a review rule with stated exceptions (tests,
# startup assertions); clippy fires on those legitimate uses.
unwrap_used = "allow"
expect_used = "allow"

[profile.release]
codegen-units = 1
lto = "thin"
strip = "symbols"

[profile.dev]
opt-level = 0
debug = 1

# Dependencies are always built with optimisation, so a debug build is still
# fast enough for grid and playback work.
[profile.dev.package."*"]
opt-level = 2
