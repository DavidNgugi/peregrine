# Architecture allowlist.
#
# This file is the architecture, expressed as data. `cargo xtask check-arch`
# reads it and fails the build on any edge that is not permitted here, so
# changing the dependency direction requires a reviewed diff to this file
# rather than a quiet edit to a manifest.
#
# Derived from docs/ARCHITECTURE.md §5 (module map) and §2 (principle P2), and
# enforced by AGENTS R6. When this file and ARCHITECTURE.md disagree, that is a
# bug in one of them, not a licence to choose.
#
#   may_depend_on  workspace crates this crate may name. Everything else is an
#                  illegal edge, including a dev-dependency cycle.
#   runtime        third-party crates permitted in [dependencies] and in
#                  target-specific dependency tables.
#   build          third-party crates permitted in [build-dependencies].
#   pure           no IO, no async, no clock, no randomness, enforced by
#                  scanning the crate's sources for the forbidden paths below.
#   optional       crates that may be named as `optional = true` features. A
#                  crate named here but absent from `runtime` is still illegal.

[workspace]
# Directories scanned for member manifests. Globs are relative to the repo root.
members = ["crates/*", "apps/desktop/src-tauri", "xtask"]
# Members that are not published and never ship.
unpublished = ["xtask", "peregrine-testkit"]

# Test-only crates every member may use. Keeping one list, rather than a
# per-crate list, is deliberate: a test dependency cannot leak into the shipped
# graph, and diverging dev-dependency sets across crates is churn.
#
# `tauri` is here rather than only in the crates that ship it because
# `peregrine-ipc`'s command test builds a mock app through `tauri::test`, which
# the crate's `test` feature gates. The feature is enabled from a dev-dependency
# only (crates/peregrine-ipc/Cargo.toml), so no shipped code changes.
[dev-dependencies]
allowed = [
  "anyhow", "criterion", "futures", "insta", "mockall", "proptest",
  "rstest", "serde", "serde_json", "tauri", "tempfile", "tokio", "tracing",
  "tracing-subscriber", "wiremock",
]

# A pure crate is scanned for these substrings in its sources. These are paths,
# not crate names, so `std::fs` is caught even though it needs no dependency.
[purity]
forbidden_paths = [
  "std::fs", "std::net", "std::process", "std::env",
  "std::time::SystemTime", "std::time::Instant", "std::thread::sleep",
  "tokio::", "sqlx::", "reqwest::", "tauri::", "std::sync::Mutex",
]
allowed_files = ["build.rs"]

# Determinism, enforced by `cargo xtask check-determinism`. Time and identifiers
# are injected through `peregrine-domain`'s `Clock` and `IdGenerator` ports
# (AGENTS R14), so no shipping crate outside the adapters below may read a wall
# clock or a random source.
#
#   adapters   crates permitted to hold a production implementation. These are the
#              leaf adapters of AGENTS R8.
#   forbidden  substrings naming a wall-clock or random entry point. Monotonic
#              clocks are deliberately absent: `Instant::now` measures a duration
#              rather than reporting a time, and `tokio::time` is what advances it
#              in a test.
#
# Test-only code is skipped by the gate: a `#[cfg(test)]` region, a
# `#[cfg(test)] mod name;` and the file it names, and anything under `tests/`.
[determinism]
adapters = ["peregrine-platform"]
forbidden = [
  # jiff: the wall clock, as an instant and as a zoned civil time.
  "Timestamp::now",
  "Zoned::now",
  # std, and `web_time`'s stand-in for it, which is what `ulid` reads.
  "SystemTime::now",
  # ulid: the wall clock plus the OS random source, which is how an id is minted.
  "Ulid::generate",
  # The random sources a new dependency could bring in.
  "rand::random",
  "getrandom::fill",
]


# --- Per-crate policy -------------------------------------------------------


[crates.peregrine-app]
may_depend_on = [
  "peregrine-cast",
  "peregrine-domain",
  "peregrine-indexers",
  "peregrine-monitor",
  "peregrine-platform",
  "peregrine-playback",
  "peregrine-providers",
  "peregrine-secrets",
  "peregrine-storage",
  "peregrine-stream",
  "peregrine-sync",
  # Test-only: `peregrine-app`'s job tests inject the shared fakes instead of
  # declaring their own (PG-E4-19). The crate never ships this edge.
  "peregrine-testkit",
  "peregrine-torrent",
]
runtime = [
  "anyhow",
  "dashmap",
  "futures",
  "jiff",
  "serde",
  "serde_json",
  "thiserror",
  "tokio",
  "tokio-util",
  "tracing",
  "tracing-appender",
  "tracing-subscriber",
  "ulid",
]
build = []
pure = false


[crates.peregrine-cast]
may_depend_on = [
  "peregrine-domain",
  "peregrine-playback",
  "peregrine-stream",
]
runtime = [
  "mdns-sd",
  "rupnp",
  "rust_cast",
  "serde",
  "thiserror",
  "tokio",
  "tracing",
]
build = []
pure = false


[crates.peregrine-desktop]
# The shell owns the window and the event loop, but the command surface it
# serves is `peregrine-ipc`'s (docs/ARCHITECTURE.md §5). Registering the
# commands here is what makes the generated TypeScript call a real one.
#
# `peregrine-domain` is the one edge beyond the contract, and it points the
# allowed way: an adapter may depend on the pure core, never the reverse. A
# `peregrine://` link is untrusted input, its grammar is a parser, and parsers
# live in the domain with the tests that pin them (AGENTS R13/R15, PG-E1-11).
may_depend_on = [
  "peregrine-ipc",
  "peregrine-domain",
]
runtime = [
  "serde",
  "serde_json",
  "tauri",
  # The native file and folder pickers (PG-E1-12). A picker is a modal the OS owns and
  # draws; the plugin is the thin binding to it, and the alternative is a hand-written
  # `rfd` call per platform plus our own ACL surface.
  "tauri-plugin-dialog",
  # The `peregrine://` scheme registration and the Apple Event delivery path (PG-E1-11).
  # Without it the OS has nothing that maps the scheme to this application, and the URL a
  # macOS launch carries is not in the process's argument vector at all.
  "tauri-plugin-deep-link",
  # Native notification delivery (PG-E1-14). The plugin owns three platform bindings that
  # would otherwise be three hand-written ones — `UNUserNotificationCenter` with a system
  # sound on macOS, a Windows toast, a D-Bus `Notify` call with an XDG sound name on
  # Linux — and it is the only implementation of the startup `on_action` click callback
  # that ADR 0015 §6 requires to exist before the first toast is shown. The core still
  # decides *whether* to notify (AGENTS R31, `peregrine-domain::notify::plan`); this edge
  # is the adapter that carries out the decision.
  "tauri-plugin-notification",
  # The login item (PG-E1-13). Registering the plugin creates none; the settings toggle
  # is the only thing that does, and reimplementing a `SMAppService` registration, a
  # registry `Run` key, and an XDG autostart entry here would be three mechanisms.
  "tauri-plugin-autostart",
  # Single-instance enforcement with argument forwarding (PG-E1-04). The plugin owns the
  # per-OS lock — a named mutex, a D-Bus name, a Unix socket — that a second launch
  # discovers; reimplementing it here would be three platform mechanisms maintained by us
  # and tested by nobody else.
  "tauri-plugin-single-instance",
  # Window geometry is this plugin's, not the shell's:
  # docs/ARCHITECTURE.md §6 puts "window geometry" in its row and lists
  # "Reimplemented" in the Never column.
  "tauri-plugin-window-state",
  # The tray's counters are re-read from the core on an interval (PG-E1-09), so the shell
  # needs the timer the rest of the workspace already uses rather than a thread that
  # sleeps beside the runtime.
  "tokio",
  "thiserror",
  "tracing",
]
build = ["tauri-build"]
pure = false


[crates.peregrine-domain]
may_depend_on = []
runtime = [
  "jiff",
  "serde",
  "thiserror",
  "ulid",
]
build = []
pure = true


[crates.peregrine-indexers]
may_depend_on = [
  "peregrine-domain",
  "peregrine-providers",
]
