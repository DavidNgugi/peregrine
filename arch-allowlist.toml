[crates.xtask]
may_depend_on = []
runtime = [
  "anyhow",
  "serde",
  # The theme files are JSON, so `check-theme` reads them with a JSON parser
  # rather than teaching a TOML parser to read another language.
  "serde_json",
  "sha2",
  "toml",
  # `pnpm-lock.yaml` is YAML, and a hand-rolled reader in a gate would be the
  # correctness risk docs/DEPENDENCIES.md §4 already paid a crate to avoid for
  # TOML.
  "yaml-rust2",
]
build = []
pure = false
