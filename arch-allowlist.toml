# Architecture allowlist.
#
# This file is the architecture, expressed as data. `cargo xtask check-arch`
# reads it and fails the build on any edge that is not permitted here, so
# changing the dependency direction requires a reviewed diff to this file
# rather than a quiet edit to a manifest.
#
# Derived from docs/ARCHITECTURE.md §5 (module map) and §2 (principle P2), and
# enforced by AGENTS R6. When this file and ARCHITECTURE.md disagree, that is a
# bug in one of them, not a licence to choose.
#
#   may_depend_on  workspace crates this crate may name. Everything else is an
#                  illegal edge, including a dev-dependency cycle.
#   runtime        third-party crates permitted in [dependencies] and in
#                  target-specific dependency tables.
#   build          third-party crates permitted in [build-dependencies].
#   pure           no IO, no async, no clock, no randomness, enforced by
#                  scanning the crate's sources for the forbidden paths below.
#   optional       crates that may be named as `optional = true` features. A
#                  crate named here but absent from `runtime` is still illegal.

[workspace]
# Directories scanned for member manifests. Globs are relative to the repo root.
members = ["crates/*", "apps/desktop/src-tauri", "xtask"]
# Members that are not published and never ship.
unpublished = ["xtask", "peregrine-testkit"]

# Test-only crates every member may use. Keeping one list, rather than a
# per-crate list, is deliberate: a test dependency cannot leak into the shipped
# graph, and diverging dev-dependency sets across crates is churn.
[dev-dependencies]
allowed = [
  "anyhow", "criterion", "futures", "insta", "mockall", "proptest",
  "rstest", "serde", "serde_json", "tempfile", "tokio", "tracing",
  "tracing-subscriber", "wiremock",
]

# A pure crate is scanned for these substrings in its sources. These are paths,
# not crate names, so `std::fs` is caught even though it needs no dependency.
[purity]
forbidden_paths = [
  "std::fs", "std::net", "std::process", "std::env",
  "std::time::SystemTime", "std::time::Instant", "std::thread::sleep",
  "tokio::", "sqlx::", "reqwest::", "tauri::", "std::sync::Mutex",
]
allowed_files = ["build.rs"]


# --- Per-crate policy -------------------------------------------------------


[crates.peregrine-app]
may_depend_on = [
  "peregrine-cast",
  "peregrine-domain",
  "peregrine-indexers",
  "peregrine-monitor",
  "peregrine-platform",
  "peregrine-playback",
  "peregrine-providers",
  "peregrine-secrets",
  "peregrine-storage",
  "peregrine-stream",
  "peregrine-sync",
  "peregrine-torrent",
]
runtime = [
  "anyhow",
  "dashmap",
  "futures",
  "jiff",
  "serde",
  "serde_json",
  "thiserror",
  "tokio",
  "tokio-util",
  "tracing",
  "ulid",
]
build = []
pure = false


