  "serde_json",
  "thiserror",
  "tracing",
]
build = []
pure = false


[crates.peregrine-ipc]
may_depend_on = [
  "peregrine-app",
]
runtime = [
  # The shortcut registry's accelerators are `muda`'s own `Modifiers`/`Code` and its
  # `CMD_OR_CTRL`, so the platform modifier is one value rather than a macOS string and a
  # Windows string that can drift apart (PG-E1-08). `tauri` already carries `muda` on
  # every desktop platform, so this is a direct edge and not a new crate in the graph.
  "muda",
  "serde",
  "serde_json",
  "specta",
  "specta-typescript",
  "tauri",
  # The login-item commands (PG-E1-13). The shell registers the plugin; the commands are
  # the only callers of `enable`, which is what keeps autostart off by default.
  "tauri-plugin-autostart",
  "tauri-specta",
  "thiserror",
  "tokio",
  "tracing",
]
build = []
pure = false


[crates.peregrine-mcp]
may_depend_on = [
  "peregrine-domain",
]
runtime = [
  "serde",
  "serde_json",
  "thiserror",
