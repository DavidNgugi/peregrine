  "tracing",
]
build = []
pure = false


[crates.peregrine-platform]
may_depend_on = [
  "peregrine-domain",
  # Test-only: the adapter's tests run the shared conformance suite against
  # `SystemClock` and `UlidGenerator`, so production and fake answer to one set of
  # assertions (PG-E4-19). The edge points from an adapter to a test crate, never
  # the other way, so it is not a cycle.
  "peregrine-testkit",
]
runtime = [
  "jiff",
  "serde",
  # The sidecar verifier hashes the artefact the pinned manifest describes; it is
  # the same SHA-256 implementation the migration journal already uses
  # (docs/adr/0022 §3), not a second hash crate for the same job.
  "sha2",
  "thiserror",
  "tokio",
  "tracing",
  # The production id generator is the one shipping site permitted to touch a
  # random source; `peregrine-platform` is a determinism adapter ([determinism]).
  "ulid",
]
build = []
pure = false


