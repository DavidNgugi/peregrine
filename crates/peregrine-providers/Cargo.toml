[package]
name = "peregrine-providers"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
description = "Peregrine component crate."
publish = false

[dependencies]
# The port names `Provider`, which is the same seven-variant vocabulary the `external_id`
# table and every `ExternalId` in the catalogue already use. A second provider enum here
# would be a second spelling of the same fact (AGENTS R3). `jiff` is the domain's own date
# type, which a search candidate carries so a remake can be told from its original.
peregrine-domain = { workspace = true }
jiff = { workspace = true }
thiserror = { workspace = true }
# Response hygiene is a validating decode (PG-E5-05), so the deserializer is a runtime
# dependency of the port rather than of one adapter: every provider's answer goes through it,
# and a client type is what must *not* be here.
serde = { workspace = true }
serde_json = { workspace = true }
# The client stack (PG-E5-02). The retry curve is this crate's own rule — a provider's `429` carries
# `Retry-After` and its `5xx` does not, and the policy is tested at a deterministic instant — so no
# retry crate is needed. The version lives in the workspace manifest with its reason.
reqwest = { workspace = true }
# The retry curve's wait. `reqwest` needs a runtime either way, and this is the one the application
# already uses; `sleep` is the only part of it this crate names.
tokio = { workspace = true }

[dev-dependencies]
# The provider test harness (docs/ARCHITECTURE.md §13). A dev-dependency rather than a runtime one:
# nothing in the shipping binary talks to a mock server.
wiremock = { workspace = true }

[lints]
workspace = true
