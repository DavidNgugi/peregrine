[package]
name = "peregrine-sync"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
description = "The job scheduler: priority queues, dedupe, backoff, and cancellation."
publish = false

[dependencies]
futures = { workspace = true }
jiff = { workspace = true }
peregrine-domain = { workspace = true }
peregrine-providers = { workspace = true }
peregrine-storage = { workspace = true }
# The image cache's key is `sha256(provider|path|variant)` (DATA_MODEL, `image_cache.key`).
# The digest is rendered as lowercase hex by `std::fmt`, so no hex crate is needed for it.
sha2 = { workspace = true }
tokio = { workspace = true }
tokio-util = { workspace = true }
tracing = { workspace = true }
thiserror = { workspace = true }
ulid = { workspace = true }

[dev-dependencies]
# The scheduler's tests inject the shared fakes instead of declaring their own.
peregrine-testkit = { workspace = true }
tempfile = { workspace = true }
tokio = { workspace = true, features = ["test-util"] }
tracing-subscriber = { workspace = true }

[lints]
workspace = true
