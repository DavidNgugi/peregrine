[package]
name = "peregrine-testkit"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
description = "Peregrine test doubles."
publish = false

[dependencies]
peregrine-domain = { workspace = true }
# The metadata provider port. The suite is written against the port itself rather than against
# one adapter's copy of it, which is what lets the same assertions run here and in the adapter's
# own crate (PG-E5-18).
peregrine-providers = { workspace = true }
# `FakeClock` and the conformance suite name `jiff::Timestamp` in their signatures,
# and `CountingIds` mints `ulid::Ulid`, so both must be runtime dependencies rather
# than test-only ones: a dev-dependency of an unpublished crate is not re-exported
# to the crates that run the suite. See the `[crates.peregrine-testkit]` entry in
# arch-allowlist.toml for the reason.
jiff = { workspace = true }
ulid = { workspace = true }

peregrine-secrets = { workspace = true }

[dev-dependencies]
# The metadata provider suite is asynchronous, because the port is: a caller awaits a
# provider. `futures` brings the executor this crate's own tests drive it with, and it is
# deliberately not a runtime dependency -- an unpublished crate's runtime dependency is
# re-exported to its callers, and no adapter should inherit an executor from the testkit.
futures = { workspace = true }

[lints]
workspace = true
