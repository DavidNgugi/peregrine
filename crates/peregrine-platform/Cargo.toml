[package]
name = "peregrine-platform"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
description = "Peregrine component crate."
publish = false

[dependencies]
peregrine-domain = { workspace = true }
jiff = { workspace = true }
# Verification hashes the artefact the pinned manifest describes (adr/0022 §3).
sha2 = { workspace = true }
thiserror = { workspace = true }
# Deleting a file is reversible, so it goes to the operating system's trash (AGENTS R22).
trash = { workspace = true }
tracing = { workspace = true }
# The production id generator is the one shipping site allowed to touch a random
# source (AGENTS R14); `cargo xtask check-determinism` enforces that.
ulid = { workspace = true }
# The system-sleep assertion behind the LAN surface and playback (PG-E1-17).
keepawake = { workspace = true }
# The host's charge for the low-battery warning (PG-E1-17).
starship-battery = { workspace = true }

[dev-dependencies]
# The adapter and the fake answer to one set of assertions: these tests run the shared
# conformance suite against `SystemClock` and `UlidGenerator`.
peregrine-testkit = { workspace = true }
# The verifier and the installer run against fixture files, including one that is
# rewritten in the window between two verification steps.
tempfile = { workspace = true }

[lints]
workspace = true
