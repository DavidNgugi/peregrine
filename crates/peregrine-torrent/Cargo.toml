[package]
name = "peregrine-torrent"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
description = "Peregrine component crate."
publish = false

[dependencies]
# The port names the domain's own vocabulary rather than a copy of it (AGENTS R3): `InfoHash` is a
# torrent's identity that `download_job.info_hash` stores (`DATA_MODEL` §2.7), `SafetyReport` is
# the gate's verdict that `add` refuses to do without, and `SafePath` is the only path type the
# engine may be handed (ADR 0005).
peregrine-domain = { workspace = true }
# The refusal vocabulary is one closed `thiserror` enum per crate, so a caller matches on a variant
# and never on a message (AGENTS §5, PG-E10-15).
thiserror = { workspace = true }
# The BitTorrent engine behind `TorrentEngine` (PG-E10-02). It is a leaf adapter: no
# librqbit type reaches a public signature (AGENTS R8), which is why the crate's own doc
# said librqbit was deliberately absent until the adapter existed.
librqbit = { workspace = true }
# The reader adapter drives librqbit's `FileStream` through `AsyncRead`/`AsyncSeek`, and the
# metadata fetch awaits the session. `io-util` carries the extension traits and the workspace
# `tokio` already enables it.
tokio = { workspace = true }
# Metadata resolution is a network boundary; the adapter records timeout versus source failure
# without ever logging the magnet or info-hash (SECURITY T13).
tracing = { workspace = true }

[lints]
workspace = true
