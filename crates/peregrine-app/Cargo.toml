[package]
name = "peregrine-app"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
description = "Peregrine component crate."
publish = false

[dependencies]
peregrine-domain = { workspace = true }
peregrine-indexers = { workspace = true }
peregrine-platform = { workspace = true }
peregrine-playback = { workspace = true }
peregrine-secrets = { workspace = true }
peregrine-providers = { workspace = true }
peregrine-storage = { workspace = true }
peregrine-stream = { workspace = true }
peregrine-sync = { workspace = true }
peregrine-torrent = { workspace = true }
# The LAN surface (ADR 0028): `axum` routes the read-only API and `tower-http` serves the built
# client and the security headers; `ReaderStream` streams a film's bytes on a range request
# instead of buffering it, which is why `tokio-util`'s io feature is on here.
axum = { workspace = true, features = ["json", "query"] }
tower-http = { workspace = true }
tokio-util = { workspace = true, features = ["io"] }
jiff = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }
tracing-appender = { workspace = true }
tracing-subscriber = { workspace = true }
ulid = { workspace = true }
# The managed Prowlarr component pack (docs/adr/0024): an HTTP download, a hash over the bytes as
# they arrive, and Prowlarr's own `config.xml` for the port and the key it generated.
reqwest = { workspace = true }
sha2 = { workspace = true }
quick-xml = { workspace = true }

# The archives are per-OS — macOS and Windows publish a zip, Linux a tar.gz — so neither reader is
# compiled on the other's target.
[target.'cfg(any(target_os = "macos", target_os = "windows"))'.dependencies]
zip = { workspace = true }

[target.'cfg(target_os = "linux")'.dependencies]
flate2 = { workspace = true }
tar = { workspace = true }

[dev-dependencies]
# The job tests inject the shared clock and id generator instead of declaring their own.
peregrine-testkit = { workspace = true }
tempfile = { workspace = true }
tokio = { workspace = true, features = ["test-util"] }

[lints]
workspace = true
