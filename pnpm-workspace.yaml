packages:
  - "apps/*"
  - "packages/*"
# pnpm 11's release-age gate asks for an explicit exception when a pinned version
# is younger than the delay; the pins in package.json are deliberate
# (docs/DEPENDENCIES.md §1), so this records the one that tripped it.
minimumReleaseAgeExclude:
  - vite@8.3.4
# `@typescript/typescript6` depends on `npm:typescript@^6`, so the compiler the
# linter's parser reads is pinned here as well as in the lockfile: 6.0.3 is the
# version that satisfies typescript-eslint's `>=4.8.4 <6.1.0` peer today.
overrides:
  "@typescript/old": "npm:typescript@6.0.3"
