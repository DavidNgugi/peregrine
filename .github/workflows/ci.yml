# The gates AGENTS.md §3 names, run on every pull request (PG-E0-13).
#
# Three jobs exist because they fail for different reasons and a maintainer needs
# to know which: `gates` is the architecture and backlog contract, `rust` is the
# code on every platform we ship, `frontend` is the TypeScript surface, and
# `supply-chain` is the dependency policy. MSRV is separate because it is a
# compatibility floor, not a correctness check.

name: ci

on:
  push:
    branches: [main]
  pull_request:
  merge_group:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Least privilege: no job here writes to the repository, so no job may ask to.
permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  gates:
    name: repository gates
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - uses: Swatinem/rust-cache@v2
      - name: Formatting
        run: cargo fmt --all --check
      - name: Dependency direction and pure-crate sources
        run: cargo xtask check-arch
      - name: No wall clock or randomness outside an adapter crate
        run: cargo xtask check-determinism
      - name: Migrations are append-only
        run: cargo xtask check-migrations
      - name: Every deferral names a task or an issue
        run: cargo xtask check-todos
      - name: Every IPC command parses, calls, and maps within its line budget
        run: cargo xtask check-commands
      - name: No query pages with OFFSET
        run: cargo xtask check-offset
      - name: Every shipped theme passes its contrast matrix
        run: cargo xtask check-theme
      - name: Sidecar licences and source offers, and the attribution artefact is current
        run: cargo xtask check-notices
      # The binding gate builds `peregrine-ipc`'s generator binary, which pulls in
      # the Tauri stack; on Linux that is the same WebKitGTK prerequisite list the
      # `rust` job installs. Everything else in this job is pure text.
      - name: Linux system dependencies (for the IPC bindings generator)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev build-essential curl wget file libxdo-dev \
            libssl-dev libayatana-appindicator3-dev librsvg2-dev
      - name: Committed IPC bindings match a fresh export
        run: cargo xtask gen-ipc --check
      - name: The declared backlog roll-up is not stale
        run: cargo xtask backlog-stats
      # The gate runs its own negative fixture, so a cargo-machete upgrade that
      # stops detecting unused dependencies fails here instead of reporting clean.
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-machete
      - name: No manifest declares a dependency its sources never use
        run: cargo xtask check-dead-deps

  rust:
    name: rust (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [macos-14, windows-2022, ubuntu-24.04]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      # The Tauri shell needs the WebKitGTK stack to link on Linux. This is the
      # prerequisite list from the Tauri v2 documentation.
      - name: Linux system dependencies
        if: startsWith(matrix.os, 'ubuntu')
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev build-essential curl wget file libxdo-dev \
            libssl-dev libayatana-appindicator3-dev librsvg2-dev
      - name: Clippy (pedantic, warnings are errors)
        run: cargo clippy --workspace --all-targets --all-features --locked -- -D warnings
      - name: Tests
        # A hung test held this job for over an hour with no output. The cap turns that into a
        # failure somebody can act on rather than a run somebody has to cancel by hand.
        timeout-minutes: 45
        run: cargo test --workspace --locked

  msrv:
    name: msrv (1.95.0)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@1.95.0
      - uses: Swatinem/rust-cache@v2
      # This job builds the whole workspace, which links the Tauri shell, so it
      # needs the same WebKitGTK stack as the `rust` and `gates` jobs. Without it
      # the MSRV job fails on `webkit2gtk-sys` with a pkg-config error that has
      # nothing to do with the language version it exists to check.
      - name: Linux system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev build-essential curl wget file libxdo-dev \
            libssl-dev libayatana-appindicator3-dev librsvg2-dev
      - name: Build at the declared MSRV
        run: cargo build --workspace --locked

  frontend:
    name: frontend
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/setup@v3
        with:
          runtime: node@24
          cache: true
      - name: Install (lockfile is authoritative)
        run: pnpm install --frozen-lockfile
      - name: Build every package
        run: pnpm -r build
      - name: Typecheck (strict, noUncheckedIndexedAccess, exactOptionalPropertyTypes)
        run: pnpm typecheck
      - name: Lint
        run: pnpm lint
      # The frontend half of the dead-dependency gate. It runs its own negative
      # fixture, so a knip upgrade that stops detecting unused dependencies fails
      # here instead of reporting clean.
      - name: No manifest declares a dependency its sources never use
        run: pnpm check-dead-deps
      - name: Formatting
        run: pnpm format:check
      - name: Unit tests
        run: pnpm test

  supply-chain:
    name: supply chain
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      # Licence allowlist, banned crates, and advisories, per deny.toml and
      # docs/DEPENDENCIES.md §6. A new licence stops the build until the docs and
      # an ADR are updated.
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check
          arguments: --all-features
      # A gate that has never failed is not known to work, and the real graph is
      # clean, so the advisory half is exercised against a fixture that is
      # deliberately vulnerable: `xtask/fixtures/supply-chain/advisory` pins
      # `paste` 1.0.15, which carries the permanent advisory RUSTSEC-2024-0436.
      # The step asserts a *non-zero* exit, so a passing run fails this job.
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-deny
      - name: The advisory gate fails on a known-advisory fixture
        working-directory: xtask/fixtures/supply-chain/advisory
        run: |
          if cargo deny check advisories; then
            echo "::error::the advisory fixture passed, so the gate no longer detects advisories"
            exit 1
          fi
      - uses: pnpm/setup@v3
        with:
          runtime: node@24
          cache: true
      - run: pnpm install --frozen-lockfile
      - name: Audit frontend dependencies
        run: pnpm audit --audit-level high
