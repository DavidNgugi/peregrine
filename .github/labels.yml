# Label taxonomy.
#
# Consumed by the label sync in .github/workflows/labels.yml so the taxonomy is
# reviewable in a diff instead of being clicked into existence in the UI.
#
# Conventions:
#   kind/*    what the change is. Exactly one.
#   state/*   where it is in the flow that docs/TASKS.md defines. Exactly one.
#   phase/*   which delivery phase it belongs to, from docs/PLAN.md §2.
#   area/*    which part of the system it touches. One or more.
#   plat/*    platform-specific only. Omitted when a task is `all`.
#   effort/*  the estimate shorthand from docs/TASKS.md conventions.
#   prio/*    triage outcome. Exactly one.
#
# There is no epic label group: an epic maps to exactly one phase, and the
# ranges in the roll-up table at the bottom of docs/TASKS.md are that mapping —
# E0–E4 phase 0, E5–E9 phase 1, E10–E15 phase 2, E16–E18 phase 3, E19–E27
# phase 4, E28–E29 phase 5, E30–E31 phase 6, E32–E34 phase 7, E35 phase 8,
# E36–E37 phase 9. An issue that belongs to an epic carries that epic's phase
# label plus the area label for what it touches.

- name: "kind/bug"
  color: "d73a4a"
  description: "Something behaves incorrectly."
- name: "kind/feature"
  color: "0e8a16"
  description: "A new user-visible capability."
- name: "kind/chore"
  color: "cfd3d7"
  description: "Tooling, dependencies, or repository plumbing."
- name: "kind/docs"
  color: "0075ca"
  description: "Documentation only."
- name: "kind/refactor"
  color: "fbca04"
  description: "No behaviour change."
- name: "kind/perf"
  color: "5319e7"
  description: "A budget, a bench, or an optimisation."
- name: "kind/test"
  color: "c2e0c6"
  description: "Test or fixture infrastructure."
- name: "kind/security"
  color: "b60205"
  description: "A SECURITY.md control or a hardening task."

- name: "state/triage"
  color: "ededed"
  description: "Not yet assessed or scheduled."
- name: "state/todo"
  color: "ededed"
  description: "Scheduled, not started. Mirrors docs/TASKS.md `todo`."
- name: "state/doing"
  color: "1d76db"
  description: "In progress. Mirrors docs/TASKS.md `doing`."
- name: "state/review"
  color: "fbca04"
  description: "Implemented, awaiting review. Mirrors docs/TASKS.md `review`."
- name: "state/done"
  color: "0e8a16"
  description: "Done means PLAN.md §8 holds, not that the code exists."
- name: "state/blocked"
  color: "000000"
  description: "Waiting on a named dependency or decision."

